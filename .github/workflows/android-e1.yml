name: Android E1 validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Source checks
        run: python3 -m unittest discover -s tests -v
      - name: Assemble and run JVM tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: petex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  visual-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cycle states and capture device screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./scripts/e1-device-test.sh
      - name: Upload screenshots for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-device-screenshots
          path: e1-screenshots/*.png
          if-no-files-found: warn
